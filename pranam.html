<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="pranam"></title>
    <link
      rel="stylesheet"
      href="./fontawesome/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <style></style>
  </head>
  <body>
    <a href="topic-3.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>

    <div class="main">
      <div class="pranam-container">
        <div class="pranam-img">
          <div class="pranam-video">
            <video
              src="./assets/videos/pranam.mp4"
              autoplay
              muted
              loop
              playsinline
            ></video>
          </div>
          <span data-lang-key="pranam"></span>
          <img src="./assets/images/pranam-img.png" alt="" />
        </div>
        <a href="index.html" class="home-btn-1">
          <span data-lang-key="home"></span>
          <img src="./assets/images/home-btn-1.png" alt="" />
        </a>
      </div>
      <img class="ring" src="./assets/images/ring-2.png" alt="" />
    </div>

    <script src="./assets/js/data.js"></script>
<script src="./assets/js/app.js"></script>
    <script src="./assets/js/djp.js"></script>

    <script>
      (function () {
        const pranamSound = new Audio("./assets/audio/pranam.mp3");
        pranamSound.preload = "auto";

        let hasPlayed = false;

        function playPranamOnce() {
          if (hasPlayed) return;
          hasPlayed = true;

          const playPromise = pranamSound.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              hasPlayed = false;
              const retry = () => {
                document.removeEventListener("click", retry);
                document.removeEventListener("keydown", retry);
                document.removeEventListener("touchstart", retry);
                playPranamOnce();
              };
              document.addEventListener("click", retry, { once: true });
              document.addEventListener("keydown", retry, { once: true });
              document.addEventListener("touchstart", retry, { once: true });
            });
          }
        }

        window.addEventListener("DOMContentLoaded", playPranamOnce);
      })();
    </script>
  </body>
</html>
